<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="yts-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Neon Rim Gradient -->
    <linearGradient id="yts-neon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>

    <!-- Emblem Core Gradient -->
    <linearGradient id="yts-glyph-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="yts-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#yts-bg-grad)" stroke="url(#yts-neon-grad)" stroke-width="18" />

  <!-- Glowing Emblem -->
  <g filter="url(#yts-glow)">
    <!-- Arrow Shaft -->
    <rect x="232" y="130" width="48" height="150" rx="12" fill="url(#yts-glyph-grad)" />

    <!-- Arrow Head -->
    <polygon points="256,360 156,260 216,260 216,250 296,250 296,260 356,260" fill="url(#yts-glyph-grad)" stroke-linejoin="round" />

    <!-- Base Studio Bar -->
    <rect x="136" y="388" width="240" height="26" rx="13" fill="url(#yts-glyph-grad)" opacity="0.95" />
  </g>
</svg>
